<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONVERSOR DE DIVISAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f8fafc;
        }
        .full-screen-bg {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc; /* Esto asegura un fondo limpio */
            padding: 1.5rem;
        }
        .main-card {
            background: #ffffff;
            border-radius: 3rem;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .input-group {
            background-color: #f8fafc;
            border: 2px solid #f1f5f9;
            border-radius: 1.5rem;
            padding: 0.85rem;
            transition: all 0.3s ease;
        }
        .input-group:focus-within {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.05);
        }
        select, input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-weight: 700;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="full-screen-bg">
        <div class="main-card">
            <!-- Header -->
            <div class="flex items-center justify-between mb-8">
                <div class="space-y-1">
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tighter leading-none">CONVERSOR DE DIVISAS</h1>
                    <div class="flex items-center gap-2">
                        <span class="relative flex h-2 w-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        <p id="status" class="text-[9px] font-bold text-emerald-600 uppercase tracking-[0.2em]">Datos en tiempo real</p>
                    </div>
                </div>
                <div class="bg-blue-600 p-3.5 rounded-2xl shadow-xl shadow-blue-200 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>

            <!-- Formulario -->
            <div class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1 tracking-widest">Seleccionar Moneda</label>
                    <div class="input-group">
                        <select id="currencySelect">
                            <option value="USD">🇺🇸 Dólar Oficial</option>
                            <option value="EUR">🇪🇺 Euro Oficial</option>
                            <option value="BRL">🇧🇷 Real Brasileño</option>
                            <option value="UYU">🇺🇾 Peso Uruguayo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2 ml-1 tracking-widest">Monto a cambiar</label>
                    <div class="input-group">
                        <input type="number" id="amountInput" value="1" class="text-xl">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="input-group">
                        <span class="block text-[8px] text-slate-400 font-bold uppercase mb-1 tracking-tighter">Compra</span>
                        <input type="number" id="buyInput" class="text-base" step="0.01">
                    </div>
                    <div class="input-group">
                        <span class="block text-[8px] text-slate-400 font-bold uppercase mb-1 tracking-tighter">Venta</span>
                        <input type="number" id="sellInput" class="text-base" step="0.01">
                    </div>
                </div>
            </div>

            <!-- Pantalla de Resultado -->
            <div class="bg-slate-900 rounded-[2.5rem] p-7 text-center mt-8 mb-6 shadow-2xl">
                <span id="avgLabel" class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.25em] block mb-2 opacity-90">Sincronizando...</span>
                <div id="result" class="text-3xl font-black text-white tracking-tight">
                    $ 0,00
                </div>
            </div>

            <!-- Botón -->
            <button onclick="fetchRates()" class="w-full py-4.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-2xl transition-all shadow-lg shadow-blue-100 active:scale-[0.97] text-xs tracking-widest uppercase mb-6">
                Actualizar Cotización
            </button>
            
            <p class="text-[9px] text-center text-slate-400 font-medium italic opacity-60">
                Tipo de cambio oficial BCRA • DolarApi.com
            </p>
        </div>
    </div>

    <script>
        const currencySelect = document.getElementById('currencySelect');
        const amountInput = document.getElementById('amountInput');
        const buyInput = document.getElementById('buyInput');
        const sellInput = document.getElementById('sellInput');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const avgLabel = document.getElementById('avgLabel');

        const endpoints = {
            'USD': 'https://dolarapi.com/v1/dolares/oficial',
            'EUR': 'https://dolarapi.com/v1/cotizaciones/eur',
            'BRL': 'https://dolarapi.com/v1/cotizaciones/brl',
            'UYU': 'https://dolarapi.com/v1/cotizaciones/uyu'
        };

        async function fetchRates() {
            const curr = currencySelect.value;
            statusDiv.innerText = "Sincronizando...";
            try {
                const res = await fetch(endpoints[curr]);
                const data = await res.json();
                buyInput.value = data.compra;
                sellInput.value = data.venta;
                statusDiv.innerText = "Datos en tiempo real";
                convert();
            } catch (e) {
                statusDiv.innerText = "Error de red";
            }
        }

        function convert() {
            const amount = parseFloat(amountInput.value) || 0;
            const sellPrice = parseFloat(sellInput.value) || 0;
            const total = amount * sellPrice;
            avgLabel.innerText = `1 ${currencySelect.value} = ARS ${sellPrice.toLocaleString('es-AR', { minimumFractionDigits: 2 })}`;
            resultDiv.innerText = total.toLocaleString('es-AR', { 
                style: 'currency', 
                currency: 'ARS',
                minimumFractionDigits: 2
            });
        }

        currencySelect.addEventListener('change', fetchRates);
        [amountInput, buyInput, sellInput].forEach(el => el.addEventListener('input', convert));
        window.onload = fetchRates;
    </script>
</body>
</html>
