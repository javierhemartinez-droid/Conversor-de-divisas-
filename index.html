<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0c0f1a;
            --surface: #131726;
            --surface2: #1a1f30;
            --border: rgba(255,255,255,0.06);
            --accent: #3b7bff;
            --accent-glow: rgba(59, 123, 255, 0.25);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.15);
            --text: #f0f4ff;
            --text-dim: rgba(240,244,255,0.45);
            --text-muted: rgba(240,244,255,0.2);
            --mono: 'DM Mono', monospace;
            --sans: 'DM Sans', sans-serif;
            --display: 'Syne', sans-serif;
        }

        body {
            font-family: var(--sans);
            background-color: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            /* Subtle grid texture */
            background-image:
                linear-gradient(rgba(59,123,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,123,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 40px 80px -20px rgba(0,0,0,0.6),
                0 0 60px -10px var(--accent-glow);
            animation: fadeUp 0.5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TOP ACCENT BAR */
        .accent-bar {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.7;
        }

        .card-inner {
            padding: 1.75rem;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 1.75rem;
        }

        .header-left h1 {
            font-family: var(--display);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1;
            text-transform: uppercase;
        }

        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .dot {
            position: relative;
            width: 7px;
            height: 7px;
        }

        .dot::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.6); }
        }

        .dot::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 50%;
            background: var(--green);
        }

        #status {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--green);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .icon-wrap {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            color: var(--accent);
        }

        .icon-wrap svg {
            display: block;
            width: 22px;
            height: 22px;
        }

        /* INPUTS */
        .field {
            margin-bottom: 1rem;
        }

        .field-label {
            font-family: var(--mono);
            font-size: 8.5px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .input-wrap {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap:focus-within {
            border-color: rgba(59,123,255,0.5);
            box-shadow: 0 0 0 3px rgba(59,123,255,0.08);
        }

        .input-wrap select,
        .input-wrap input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-family: var(--sans);
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
            -webkit-appearance: none;
        }

        .input-wrap select option {
            background: #1a1f30;
            color: var(--text);
        }

        .rates-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 1.25rem;
        }

        .rate-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 11px 13px;
            transition: border-color 0.2s;
        }

        .rate-box:focus-within {
            border-color: rgba(59,123,255,0.4);
        }

        .rate-label {
            font-family: var(--mono);
            font-size: 8px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            display: block;
            margin-bottom: 5px;
        }

        .rate-box input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-family: var(--mono);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        /* RESULT */
        .result-panel {
            background: linear-gradient(135deg, #0d1b4b 0%, #0c1435 100%);
            border: 1px solid rgba(59,123,255,0.2);
            border-radius: 20px;
            padding: 1.5rem 1.25rem;
            text-align: center;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .result-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59,123,255,0.6), transparent);
        }

        #avgLabel {
            font-family: var(--mono);
            font-size: 9px;
            font-weight: 500;
            color: rgba(100,150,255,0.7);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 10px;
        }

        #result {
            font-family: var(--mono);
            font-size: 1.5rem;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.04em;
            line-height: 1;
        }

        /* BUTTON */
        .refresh-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(59,123,255,0.3);
            margin-bottom: 1.25rem;
        }

        .refresh-btn:hover {
            background: #5090ff;
            box-shadow: 0 6px 28px rgba(59,123,255,0.45);
        }

        .refresh-btn:active {
            transform: scale(0.97);
        }

        .refresh-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.4s ease;
        }

        .refresh-btn.loading svg {
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FOOTER */
        .footer-note {
            font-family: var(--mono);
            font-size: 8.5px;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.1em;
        }

        /* Input number arrow hide */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>

<div class="card">
    <div class="accent-bar"></div>
    <div class="card-inner">

        <div class="header">
            <div class="header-left">
                <h1>Conversor de Divisas</h1>
                <div class="status-row">
                    <div class="dot"></div>
                    <span id="status">Conectando...</span>
                </div>
            </div>
            <div class="icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>

        <div class="field">
            <div class="field-label">Divisa</div>
            <div class="input-wrap">
                <select id="currencySelect">
                    <option value="USD">🇺🇸  Dólar Oficial</option>
                    <option value="EUR">🇪🇺  Euro Oficial</option>
                    <option value="BRL">🇧🇷  Real Brasileño</option>
                    <option value="UYU">🇺🇾  Peso Uruguayo</option>
                </select>
            </div>
        </div>

        <div class="field">
            <div class="field-label">Monto</div>
            <div class="input-wrap">
                <input type="number" id="amountInput" value="1" placeholder="0">
            </div>
        </div>

        <div class="rates-grid">
            <div class="rate-box">
                <span class="rate-label">Compra</span>
                <input type="number" id="buyInput" step="0.01" placeholder="—">
            </div>
            <div class="rate-box">
                <span class="rate-label">Venta</span>
                <input type="number" id="sellInput" step="0.01" placeholder="—">
            </div>
        </div>

        <div class="result-panel">
            <span id="avgLabel">Sincronizando...</span>
            <div id="result">$ 0,00</div>
        </div>

        <button class="refresh-btn" id="refreshBtn" onclick="fetchRates()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
            </svg>
            Actualizar
        </button>

        <div class="footer-note">BCRA · DolarApi.com</div>
        <div style="font-family: var(--mono); font-size: 8.5px; color: var(--text-muted); text-align: center; margin-top: 6px; letter-spacing: 0.1em; opacity: 0.5;">by Waviwan</div>

    </div>
</div>

<script>
    const currencySelect = document.getElementById('currencySelect');
    const amountInput    = document.getElementById('amountInput');
    const buyInput       = document.getElementById('buyInput');
    const sellInput      = document.getElementById('sellInput');
    const statusDiv      = document.getElementById('status');
    const resultDiv      = document.getElementById('result');
    const avgLabel       = document.getElementById('avgLabel');
    const refreshBtn     = document.getElementById('refreshBtn');

    const endpoints = {
        'USD': 'https://dolarapi.com/v1/dolares/oficial',
        'EUR': 'https://dolarapi.com/v1/cotizaciones/eur',
        'BRL': 'https://dolarapi.com/v1/cotizaciones/brl',
        'UYU': 'https://dolarapi.com/v1/cotizaciones/uyu'
    };

    async function fetchRates() {
        const curr = currencySelect.value;
        refreshBtn.classList.add('loading');
        statusDiv.innerText = 'Sincronizando...';
        statusDiv.style.color = '#94a3b8';

        try {
            const res = await fetch(endpoints[curr]);
            if (!res.ok) throw new Error('API error');
            const data = await res.json();

            buyInput.value  = data.compra;
            sellInput.value = data.venta;

            localStorage.setItem(`bcra_buy_${curr}`,  data.compra);
            localStorage.setItem(`bcra_sell_${curr}`, data.venta);

            const time = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            statusDiv.innerText = `Actualizado ${time}`;
            statusDiv.style.color = 'var(--green)';
            convert();
        } catch (e) {
            const cachedBuy  = localStorage.getItem(`bcra_buy_${curr}`);
            const cachedSell = localStorage.getItem(`bcra_sell_${curr}`);
            if (cachedBuy && cachedSell) {
                buyInput.value  = cachedBuy;
                sellInput.value = cachedSell;
                statusDiv.innerText = 'Modo offline';
                statusDiv.style.color = '#f59e0b';
                convert();
            } else {
                statusDiv.innerText = 'Sin conexión';
                statusDiv.style.color = '#ef4444';
            }
        } finally {
            refreshBtn.classList.remove('loading');
        }
    }

    function convert() {
        const amount    = parseFloat(amountInput.value) || 0;
        const sellPrice = parseFloat(sellInput.value)  || 0;
        const total     = amount * sellPrice;

        avgLabel.innerText = `1 ${currencySelect.value} = ARS ${sellPrice.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        resultDiv.innerText = total.toLocaleString('es-AR', {
            style: 'currency',
            currency: 'ARS',
            minimumFractionDigits: 2
        });
    }

    currencySelect.addEventListener('change', fetchRates);
    [amountInput, buyInput, sellInput].forEach(el => el.addEventListener('input', convert));
    window.onload = fetchRates;
</script>
</body>
</html>
