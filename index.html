<body class="min-h-screen flex items-center justify-center p-6">

        <div class="flex items-center justify-between">
            <div class="space-y-1">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Finanzas AR</h1>

            <div class="bg-blue-600 p-4 rounded-[1.5rem] shadow-xl shadow-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            </div>
        </div>

        <!-- Formulario -->
        <div class="space-y-6">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2.5 ml-1 tracking-widest">Moneda de origen</label>
                <select id="currencySelect" class="input-field w-full text-slate-700 text-sm rounded-2xl p-4 font-semibold outline-none cursor-pointer">
                    <option value="USD">🇺🇸 Dólar Oficial</option>
                    <option value="EUR">🇪🇺 Euro Oficial</option>
                    <option value="BRL">🇧🇷 Real Brasileño</option>
                    <option value="UYU">🇺🇾 Peso Uruguayo</option>
                </select>
            </div>

            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase mb-2.5 ml-1 tracking-widest">Monto a convertir</label>
                <input type="number" id="amountInput" value="1" class="input-field w-full text-slate-900 text-2xl font-extrabold rounded-2xl p-4 outline-none" placeholder="0">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-field p-4 rounded-2xl">
                    <span class="block text-[9px] text-slate-400 font-bold uppercase mb-1 tracking-tighter">Compra</span>
                    <div class="flex items-baseline">

                </div>

        </div>

        <!-- Panel de Resultado -->
        <div class="bg-slate-900 rounded-[2.5rem] p-8 text-center shadow-2xl relative overflow-hidden">

            <div class="absolute top-0 right-0 -mr-4 -mt-4 w-24 h-24 bg-blue-500/10 rounded-full blur-2xl"></div>
            
            <span id="avgLabel" class="text-[10px] text-blue-400 font-bold uppercase tracking-[0.2em] block mb-3 opacity-80">Cargando cotización...</span>

                ACTUALIZAR DATOS
            </button>
            <p class="text-[10px] text-center text-slate-400 font-medium leading-relaxed px-4">

            </p>
        </div>
    </div>

    <script>
        const currencySelect = document.getElementById('currencySelect');
        const amountInput = document.getElementById('amountInput');
        const buyInput = document.getElementById('buyInput');
        const sellInput = document.getElementById('sellInput');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const avgLabel = document.getElementById('avgLabel');

        const endpoints = {
            'USD': 'https://dolarapi.com/v1/dolares/oficial',
            'EUR': 'https://dolarapi.com/v1/cotizaciones/eur',
            'BRL': 'https://dolarapi.com/v1/cotizaciones/brl',
            'UYU': 'https://dolarapi.com/v1/cotizaciones/uyu'
        };

        async function fetchRates() {
            const curr = currencySelect.value;
            statusDiv.innerText = "Sincronizando...";
            statusDiv.className = "text-[10px] font-bold text-amber-500 uppercase tracking-[0.15em] mt-1";

            try {
                const res = await fetch(endpoints[curr]);
                const data = await res.json();
                
                buyInput.value = data.compra;
                sellInput.value = data.venta;
                
                statusDiv.innerText = "Datos Actualizados";
                statusDiv.className = "text-[10px] font-bold text-emerald-600 uppercase tracking-[0.15em] mt-1";
                convert();
            } catch (e) {
                statusDiv.innerText = "Error de Red";
                statusDiv.className = "text-[10px] font-bold text-red-500 uppercase tracking-[0.15em] mt-1";
            }
        }

        function convert() {
            const amount = parseFloat(amountInput.value) || 0;
            const sellPrice = parseFloat(sellInput.value) || 0;
            const total = amount * sellPrice;
            
            avgLabel.innerText = `1 ${currencySelect.value} = ARS ${sellPrice.toLocaleString('es-AR', { minimumFractionDigits: 2 })}`;
            resultDiv.innerText = total.toLocaleString('es-AR', { 
                style: 'currency', 
                currency: 'ARS',
                minimumFractionDigits: 2
            });
        }

        currencySelect.addEventListener('change', fetchRates);
        [amountInput, buyInput, sellInput].forEach(el => el.addEventListener('input', convert));

        window.onload = fetchRates;
    </script>
</body>
</html>
