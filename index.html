```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Oficial BCRA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f3f4f6; 
            font-family: 'Inter', -apple-system, sans-serif; 
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md p-8 rounded-[2rem] shadow-2xl space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Finanzas AR</h1>
                <p id="status" class="text-[10px] font-bold text-emerald-600 uppercase tracking-widest mt-1 italic">Sincronizando...</p>
            </div>
            <div class="bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                </svg>
            </div>
        </div>

        <!-- App Body -->
        <div class="space-y-5">
            <!-- Selector -->
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Moneda de origen</label>
                <select id="currencySelect" class="w-full bg-gray-50 border-2 border-gray-100 text-gray-800 text-sm rounded-2xl p-4 focus:border-blue-500 transition-all outline-none appearance-none font-medium">
                    <option value="USD">🇺🇸 Dólar Oficial</option>
                    <option value="EUR">🇪🇺 Euro Oficial</option>
                    <option value="BRL">🇧🇷 Real Brasileño</option>
                    <option value="UYU">🇺🇾 Peso Uruguayo</option>
                </select>
            </div>

            <!-- Input Monto -->
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Monto a convertir</label>
                <div class="relative">
                    <input type="number" id="amountInput" value="1" class="w-full bg-gray-50 border-2 border-gray-100 text-gray-900 text-2xl font-bold rounded-2xl p-4 focus:border-blue-500 outline-none transition-all" placeholder="0">
                </div>
            </div>

            <!-- Cotizaciones Manuales/Info -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <span class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Compra</span>
                    <input type="number" id="buyInput" class="w-full bg-transparent font-bold text-gray-700 outline-none text-lg">
                </div>
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <span class="block text-[10px] text-gray-400 font-bold uppercase mb-1">Venta</span>
                    <input type="number" id="sellInput" class="w-full bg-transparent font-bold text-gray-700 outline-none text-lg">
                </div>
            </div>
        </div>

        <!-- Resultado -->
        <div class="bg-gray-900 rounded-[1.5rem] p-6 text-center shadow-xl">
            <span id="avgLabel" class="text-[10px] text-blue-400 font-bold uppercase tracking-widest block mb-1">Tipo de Cambio</span>
            <div id="result" class="text-3xl font-black text-white truncate">
                $ 0,00
            </div>
        </div>

        <!-- Footer Button -->
        <button onclick="fetchRates()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-2xl transition-all shadow-lg active:scale-[0.98] flex items-center justify-center gap-3">
            <span>ACTUALIZAR DATOS</span>
        </button>
        
        <p class="text-[10px] text-center text-gray-400 font-medium italic">Datos oficiales del BCRA vía DolarApi.com</p>
    </div>

    <script>
        const currencySelect = document.getElementById('currencySelect');
        const amountInput = document.getElementById('amountInput');
        const buyInput = document.getElementById('buyInput');
        const sellInput = document.getElementById('sellInput');
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const avgLabel = document.getElementById('avgLabel');

        const endpoints = {
            'USD': 'https://dolarapi.com/v1/dolares/oficial',
            'EUR': 'https://dolarapi.com/v1/cotizaciones/eur',
            'BRL': 'https://dolarapi.com/v1/cotizaciones/brl',
            'UYU': 'https://dolarapi.com/v1/cotizaciones/uyu'
        };

        async function fetchRates() {
            const curr = currencySelect.value;
            statusDiv.innerText = "Sincronizando...";
            statusDiv.classList.replace('text-emerald-600', 'text-amber-500');

            try {
                const res = await fetch(endpoints[curr]);
                const data = await res.json();
                
                buyInput.value = data.compra;
                sellInput.value = data.venta;
                
                statusDiv.innerText = "✓ Datos actualizados";
                statusDiv.classList.replace('text-amber-500', 'text-emerald-600');
                convert();
            } catch (e) {
                statusDiv.innerText = "⚠️ Error de red";
                statusDiv.classList.replace('text-emerald-600', 'text-red-500');
            }
        }

        function convert() {
            const amount = parseFloat(amountInput.value) || 0;
            const sellPrice = parseFloat(sellInput.value) || 0;
            const total = amount * sellPrice;
            
            avgLabel.innerText = `1 ${currencySelect.value} = ARS ${sellPrice.toFixed(2)}`;
            resultDiv.innerText = total.toLocaleString('es-AR', { 
                style: 'currency', 
                currency: 'ARS',
                minimumFractionDigits: 2
            });
        }

        currencySelect.addEventListener('change', fetchRates);
        [amountInput, buyInput, sellInput].forEach(el => {
            el.addEventListener('input', convert);
        });

        // Carga inicial
        window.onload = fetchRates;
    </script>
</body>
</html>
